 o Código de Trânsito Brasileiro, assinale: ${["Dirigir sob influência de álcool é infração gravíssima com agravante e crime do art.306 se alcoolemia >0,33mg/L ou sinais de alteração psicomotora.","Recusa ao bafômetro gera infração gravíssima art.165-A, multa 10x, suspensão 12 meses.","Velocidade superior à máxima em até 20% é infração média; de 20% a 50% grave; acima de 50% gravíssima com suspensão.","Transpor bloqueio policial é infração gravíssima com suspensão.","Deixar de prestar socorro à vítima é infração e crime.","A CNH cassada impede obter nova por 2 anos."][n%6]}`:`Sobre Direito Penal/Processo Penal aplicado à PRF: ${["Flagrante delito: art.302 CPP - está cometendo, acaba de cometer, perseguido logo após, encontrado com instrumentos.","Prisão em flagrante por crime inafiançável exige comunicação ao juiz em 24h e audiência custódia.","Legítima defesa exige agressão injusta atual/iminente, uso moderado dos meios.","Tráfico privilegiado §4 art.33 Lei Drogas reduz pena de 1/6 a 2/3 se primário, bons antecedentes, não dedicação.","Contrabando é importar/exportar mercadoria proibida; descaminho é iludir tributo.","Abuso de autoridade Lei 13.869/19 criminaliza condutas específicas com dolo."][n%6]}`}`,alternativas:[{letra:"A",texto:l.includes("CTB")?"Conduta tipifica infração gravíssima com penalidade de multa agravada e suspensão, conforme CTB.":"Conduta se enquadra no tipo penal com pena de reclusão e causa de aumento."},{letra:"B",texto:"Conduta é atípica por ausência de dolo específico exigido pelo tipo."},{letra:"C",texto:"Conduta é infração média com penalidade de 4 pontos, sem agravantes."},{letra:"D",texto:"Conduta enseja apenas medida administrativa de retenção, sem multa."},{letra:"E",texto:"Conduta depende de representação da vítima para persecução."}],isCE:!1,gabarito:o,comentario:`PROFESSOR BÔNUS: Gab ${o}. ${l} é foco PRF. Memorize artigos literais e fatores multiplicadores.`,dificuldade:"Alta"}}),U0=[...Yc,...Xc,...Zc],Ol={regime:`TEXTO I – REGIME AUTOMOTIVO / INOVAR-AUTO

O regime automotivo brasileiro, denominado Inovar-Auto, foi instituído com vistas a estimular a competitividade e a inovação na indústria automobilística nacional. O programa prevê requisitos de investimento em pesquisa e desenvolvimento, engenharia, tecnologia industrial básica e capacitação de fornecedores.

A política estabelece alíquotas de IPI diferenciadas e créditos presumidos para empresas habilitadas que cumpram metas de eficiência energética e de etapas fabris no país. O objetivo central é adensar a cadeia produtiva, elevar o conteúdo local e fomentar a produção de veículos mais econômicos e seguros.

Segundo o governo, o programa busca alinhar o Brasil às melhores práticas internacionais, sem ferir compromissos na OMC, e garantir previsibilidade para investimentos de longo prazo. Críticos apontam risco de protecionismo, mas defensores destacam geração de empregos qualificados e transferência de tecnologia.

O regime vigorou entre 2013 e 2017, sendo substituído posteriormente pelo Rota 2030, com foco ampliado em eficiência, segurança veicular e desenvolvimento tecnológico.`,era:`TEXTO II – A ERA DO AUTOMÓVEL / MALHA RODOVIÁRIA – TEXTO COMPLETO EM DESTAQUE DOURADO

O Brasil possui uma malha rodoviária de aproximadamente 1,7 milhão de quilômetros, contando rodovias federais, estaduais e municipais, pavimentadas e não pavimentadas. Esse número coloca o país entre as maiores malhas do mundo, embora com baixa densidade de pavimentação e desafios de manutenção.

O modal rodoviário é, de longe, o principal meio de transporte no país: é responsável por 96,2% do transporte de passageiros e 61,8% do transporte de cargas, segundo dados da Confederação Nacional do Transporte. A predominância rodoviária explica-se por escolhas históricas e políticas de Estado.

A opção rodoviarista começou na década de 30, no governo Vargas, quando se iniciou a construção de rodovias de integração nacional. Contudo, foi nas décadas de 50 e 60, com a implantação da indústria automobilística no governo JK e o Plano de Metas, que o transporte rodoviário se tornou hegemônico, em detrimento do ferroviário e hidroviário.

A partir de então, o automóvel tornou-se símbolo de modernidade e desenvolvimento. A indústria atraiu investimentos estrangeiros, gerou empregos e interiorizou o desenvolvimento, mas também criou dependência excessiva do petróleo e externalidades como acidentes e poluição.

Recentemente, para enfrentar gargalos logísticos, o governo federal lançou o Programa de Investimentos em Logística, que anunciou R$ 133 bilhões para concessão de 7,5 mil km de rodovias federais, com duplicações, contornos e melhorias de segurança. O objetivo é reduzir custo Brasil e aumentar competitividade.

A PRF, inserida nesse contexto, tem papel estratégico na segurança viária, no combate ao crime e na garantia da fluidez logística que sustenta 61,8% das cargas nacionais.

DADOS PARA MEMORIZAR (PROVA):
• 1,7 milhão km de malha
• 96,2% passageiros
• 61,8% cargas
• Década de 30: início opção rodoviarista
• Décadas de 50 e 60: implantação indústria automobilística / hegemonia rodoviária
• Programa Investimentos em Logística: R$ 133 bilhões / 7,5 mil km`,sitio:`TEXTO III – SÍTIO DA PRF COMO FERRAMENTA DE CIDADANIA

O sítio da Polícia Rodoviária Federal na internet (www.prf.gov.br) consolidou-se como ferramenta de transparência e prestação de serviços ao cidadão. Nele, é possível consultar multas, obter informações sobre documentos de porte obrigatório, acessar estatísticas de acidentes, registrar manifestações na ouvidoria e acompanhar leilões de veículos.

Além disso, o portal divulga campanhas educativas, alertas de interdições e orientações para viagens seguras. A iniciativa aproxima a instituição da sociedade e fortalece o controle social, ao permitir que qualquer cidadão acompanhe produtividade e ocorrências.

Para a banca, o texto aborda ainda a importância da linguagem clara e acessível na comunicação pública, com foco no cidadão como destinatário final do serviço.`,seguranca:`TEXTO IV – SEGURANÇA NAS ESTRADAS E PAPEL DA PRF

A segurança nas estradas não depende exclusivamente da fiscalização, mas de um tripé: engenharia viária, esforço legal (fiscalização) e educação para o trânsito. A PRF atua principalmente no segundo pilar, mas também promove ações educativas.

O excesso de velocidade, a embriaguez ao volante e a falta de uso de cinto de segurança e de cadeirinha continuam entre as principais causas de sinistros com vítimas. A fiscalização com radares, etilômetros e operações temáticas visa mudar comportamento, não apenas punir.

Estudos mostram que cada R$ 1 investido em segurança viária economiza R$ 8 em custos hospitalares e previdenciários. Por isso, a PRF integra o Plano Nacional de Redução de Mortes e Lesões no Trânsito (PNATRANS).
